name: Dart and Flutter

# Every PR and every push to main. Dart and Flutter packages must pass tests.
on:
  pull_request:
  push:
    branches: [main]

# A superseded push should stop burning runners, but never cancel main.
concurrency:
  group: dart-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Test count floors (ratchets — raise deliberately, never lower to make red green).
  # These catch regressions that DELETE tests. Counts verified by filtering out
  # synthetic "loading <file>" testStart entries from --reporter json output,
  # then comparing against --reporter compact final count (+N).
  DART_TEST_FLOOR: '331'
  DART_REST_TEST_FLOOR: '464'
  FLUTTER_TEST_FLOOR: '1245'

jobs:
  # ---------------------------------------------------------------------------
  # Dart and Flutter CI: analyze, format, test
  # ---------------------------------------------------------------------------
  dart-flutter:
    name: Dart and Flutter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Flutter 3.24.4 pins Dart 3.5.4 transitively
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.4
          cache: true

      # ---------------------------------------------------------------------------
      # packages/dart: pure Dart package
      # ---------------------------------------------------------------------------
      - name: packages/dart - pub get
        run: cd packages/dart && dart pub get

      - name: packages/dart - analyze --fatal-infos
        run: cd packages/dart && dart analyze --fatal-infos

      - name: packages/dart - format --set-exit-if-changed
        run: cd packages/dart && dart format --set-exit-if-changed .

      - name: packages/dart - test
        run: cd packages/dart && dart test --reporter json 2>&1 | tee /tmp/dart-test.json
        continue-on-error: false

      - name: 'packages/dart - verify test count'
        run: |
          # Filter out synthetic "loading <file>" entries from testStart;
          # count only real test starts (consistent with --reporter compact)
          ACTUAL_COUNT=$(grep '"type":"testStart"' /tmp/dart-test.json | grep -v '"name":"loading' | wc -l)
          FLOOR=${{ env.DART_TEST_FLOOR }}
          echo "packages/dart: $ACTUAL_COUNT tests (floor: $FLOOR)"
          if [ "$ACTUAL_COUNT" -lt "$FLOOR" ]; then
            echo "::error::packages/dart test count REGRESSION: $ACTUAL_COUNT < $FLOOR (tests deleted)"
            exit 1
          fi

      # ---------------------------------------------------------------------------
      # packages/dart_rest: the REST surface dhaam_chat deliberately has no HTTP
      # client to reach. Gated exactly like the other two.
      # ---------------------------------------------------------------------------
      - name: packages/dart_rest - pub get
        run: cd packages/dart_rest && dart pub get

      - name: packages/dart_rest - analyze --fatal-infos
        run: cd packages/dart_rest && dart analyze --fatal-infos

      - name: packages/dart_rest - format --set-exit-if-changed
        run: cd packages/dart_rest && dart format --set-exit-if-changed .

      - name: packages/dart_rest - test
        run: cd packages/dart_rest && dart test --reporter json 2>&1 | tee /tmp/dart_rest-test.json

      - name: packages/dart_rest - verify test count
        run: |
          # Same filter as the two packages above: `--reporter json` emits
          # newline-delimited JSON (NOT an array, so `jq '.[]'` cannot read it)
          # and prefixes one synthetic "loading <file>" testStart per suite.
          ACTUAL_COUNT=$(grep '"type":"testStart"' /tmp/dart_rest-test.json | grep -v '"name":"loading' | wc -l)
          FLOOR=${{ env.DART_REST_TEST_FLOOR }}
          echo "packages/dart_rest: $ACTUAL_COUNT tests (floor: $FLOOR)"
          if [ "$ACTUAL_COUNT" -lt "$FLOOR" ]; then
            echo "::error::packages/dart_rest test count REGRESSION: $ACTUAL_COUNT < $FLOOR (tests deleted)"
            exit 1
          fi

      # ---------------------------------------------------------------------------
      # packages/flutter: Flutter package
      # ---------------------------------------------------------------------------
      - name: packages/flutter - pub get
        run: cd packages/flutter && flutter pub get

      - name: packages/flutter - analyze --fatal-infos
        run: cd packages/flutter && flutter analyze --fatal-infos

      - name: packages/flutter - format --set-exit-if-changed
        run: cd packages/flutter && dart format --set-exit-if-changed .

      - name: packages/flutter - test
        run: cd packages/flutter && flutter test --reporter json 2>&1 | tee /tmp/flutter-test.json
        continue-on-error: false

      - name: 'packages/flutter - verify test count'
        run: |
          # Filter out synthetic "loading <file>" entries from testStart;
          # count only real test starts (consistent with --reporter compact)
          ACTUAL_COUNT=$(grep '"type":"testStart"' /tmp/flutter-test.json | grep -v '"name":"loading' | wc -l)
          FLOOR=${{ env.FLUTTER_TEST_FLOOR }}
          echo "packages/flutter: $ACTUAL_COUNT tests (floor: $FLOOR)"
          if [ "$ACTUAL_COUNT" -lt "$FLOOR" ]; then
            echo "::error::packages/flutter test count REGRESSION: $ACTUAL_COUNT < $FLOOR (tests deleted)"
            exit 1
          fi
